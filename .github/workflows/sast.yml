# DORMANT on the free GitHub plan (Actions billing blocked): this workflow does not run.
# The Semgrep scan is mirrored locally by the /audit skill. Activates at /handoff when the
# IT team's paid plan runs Actions. See SECURITY.md §14 / ADR-007.
#
# Triggers are set to workflow_dispatch (manual) only so the job does not auto-run and
# fail-in-2s on a billing-blocked plan. AT HANDOFF: restore the real triggers below.
name: SAST

on:
  workflow_dispatch:
  # Restore at handoff (paid Actions):
  # pull_request:
  # push:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Pinned tag (not :latest) for reproducibility. Bump deliberately.
      image: semgrep/semgrep:1.139.0
    steps:
      - uses: actions/checkout@v5

      # Rulesets:
      #   p/javascript       -- generic JS/TS issues (eval, XSS sinks, etc.)
      #   p/typescript       -- TS-specific patterns
      #   p/nextjs           -- Next.js App Router pitfalls (server/client leaks)
      #   p/react            -- React-specific anti-patterns (dangerouslySetInnerHTML, etc.)
      #   p/owasp-top-ten    -- OWASP Top 10 coverage
      #   p/secrets          -- hardcoded creds
      # `semgrep ci` exits non-zero on any finding at the configured severity gate.
      - name: Run Semgrep
        run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/javascript
            p/typescript
            p/nextjs
            p/react
            p/owasp-top-ten
            p/secrets
