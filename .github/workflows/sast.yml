# DORMANT on the free GitHub plan (Actions billing blocked): this workflow does not run.
# The Semgrep scan is mirrored locally by the /audit skill. Activates at /handoff when the
# IT team's paid plan runs Actions. See SECURITY.md §14 / ADR-007.
#
# Triggers are set to workflow_dispatch (manual) only so the job does not auto-run and
# fail-in-2s on a billing-blocked plan. AT HANDOFF: restore the real triggers below.
name: SAST

on:
  workflow_dispatch:
  # Restore at handoff (paid Actions):
  # pull_request:
  # push:

permissions:
  contents: read
  # Lets the SARIF upload below post findings to the repo Security tab.
  security-events: write

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Pinned tag (not :latest) for reproducibility. Bump deliberately.
      image: semgrep/semgrep:1.139.0
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Rulesets:
      #   p/javascript       -- generic JS/TS issues (eval, XSS sinks, etc.)
      #   p/typescript       -- TS-specific patterns
      #   p/nextjs           -- Next.js App Router pitfalls (server/client leaks)
      #   p/react            -- React-specific anti-patterns (dangerouslySetInnerHTML, etc.)
      #   p/owasp-top-ten    -- OWASP Top 10 coverage
      #   p/secrets          -- hardcoded creds
      # `semgrep ci` exits non-zero on any finding at the configured severity gate.
      # `--sarif --output` also writes a SARIF report for the Security-tab upload
      # below; the step still fails the job on findings (the gate).
      - name: Run Semgrep
        run: semgrep ci --sarif --output semgrep.sarif
        env:
          SEMGREP_RULES: >-
            p/javascript
            p/typescript
            p/nextjs
            p/react
            p/owasp-top-ten
            p/secrets

      # Upload SARIF so findings land in the Security tab. Guarded so a dormant /
      # clean run (no report file) does not fail: only runs when Semgrep wrote a
      # report, and `!cancelled()` lets it run even after the scan step failed.
      - name: Upload Semgrep SARIF
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@d77b13a0df3134d64a457ea9003f600b09fa1c8a # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
