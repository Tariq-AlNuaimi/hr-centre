# DORMANT on the free GitHub plan (Actions billing blocked): this workflow does not run.
# Release tooling is Changesets (npm run changeset / changeset:version). Activates at /handoff
# when the IT team's paid plan runs Actions. See SECURITY.md §14 / ADR-007.
#
# Triggers are set to workflow_dispatch (manual) only so the job does not auto-run and
# fail-in-2s on a billing-blocked plan. AT HANDOFF: restore the push trigger below.
name: Release

on:
  workflow_dispatch:
  # Restore at handoff (paid Actions):
  # push:
  #   branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # ADR-051 install-time hardening: no lifecycle scripts from the dep tree; the
      # explicit rebuild allowlist runs the few genuinely needed ones (in lockstep
      # with the Dockerfile deps stage).
      - run: |
          npm ci --ignore-scripts
          npm rebuild @prisma/engines @sentry/cli sharp @swc/core esbuild unrs-resolver @parcel/watcher

      # Opens/updates a "Version Packages" PR, or tags a release when one merges.
      - name: Changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
