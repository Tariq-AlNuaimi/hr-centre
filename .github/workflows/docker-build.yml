name: Build & Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sentry source-map upload (ADR-002). Runs only when SENTRY_AUTH_TOKEN
      # is set as a repo secret AND SENTRY_ORG / SENTRY_PROJECT are set as repo
      # vars. Otherwise the step skips silently -- early forks deploy without
      # Sentry configured. Source-maps are uploaded directly from the runner
      # via @sentry/cli; we don't try to extract them from the Docker image.
      - name: Upload source-maps to Sentry
        if: ${{ success() && env.HAS_SENTRY == 'true' }}
        env:
          HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SHA: ${{ github.sha }}
        run: |
          # Build locally just to emit source-maps (Docker image is already
          # pushed at this point; this runs in parallel-friendly fashion).
          npm ci --omit=optional --no-audit --no-fund
          npx next build || (echo "next build for sourcemaps failed; skipping upload" && exit 0)
          npx @sentry/cli releases new "${SHA}" || true
          npx @sentry/cli releases set-commits "${SHA}" --auto || true
          npx @sentry/cli sourcemaps inject .next || true
          npx @sentry/cli sourcemaps upload --release="${SHA}" .next || true
          npx @sentry/cli releases finalize "${SHA}" || true
        continue-on-error: true

      # IMAGE_TAG is passed on the webhook query string. Portainer STACK webhooks
      # treat query-string params as environment-variable overrides for the stack,
      # so docker-compose.prod.yml's `${IMAGE_TAG:-latest}` resolves to the SHA tag
      # on this deploy. SERVICE webhooks ignore the query string -- they redeploy
      # whatever :latest currently points to, which is also fine (just no SHA pin).
      # See SECURITY.md finding T-04.
      #
      # Skip silently when PORTAINER_WEBHOOK_URL is unset: a fork that has not
      # yet run /deploy will not have the webhook secret. The image is still
      # built and pushed to GHCR above; /deploy reads :latest on first run.
      - name: Trigger Portainer stack update
        if: ${{ success() && env.HAS_WEBHOOK == 'true' }}
        env:
          HAS_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL != '' }}
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          curl -s -X POST "${WEBHOOK_URL}?IMAGE_TAG=sha-${SHORT_SHA}"
          echo "Portainer webhook triggered with IMAGE_TAG=sha-${SHORT_SHA}"
