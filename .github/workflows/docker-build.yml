name: Build & Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sentry source-map upload (ADR-002). Runs only when SENTRY_AUTH_TOKEN
      # is set as a repo secret AND SENTRY_ORG / SENTRY_PROJECT are set as repo
      # vars. Otherwise the step skips silently -- early forks deploy without
      # Sentry configured. Source-maps are uploaded directly from the runner
      # via @sentry/cli; we don't try to extract them from the Docker image.
      - name: Upload source-maps to Sentry
        if: ${{ success() && env.HAS_SENTRY == 'true' }}
        env:
          HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SHA: ${{ github.sha }}
        run: |
          # Build locally just to emit source-maps (Docker image is already
          # pushed at this point; this runs in parallel-friendly fashion).
          npm ci --omit=optional --no-audit --no-fund
          npx next build || (echo "next build for sourcemaps failed; skipping upload" && exit 0)
          npx @sentry/cli releases new "${SHA}" || true
          npx @sentry/cli releases set-commits "${SHA}" --auto || true
          npx @sentry/cli sourcemaps inject .next || true
          npx @sentry/cli sourcemaps upload --release="${SHA}" .next || true
          npx @sentry/cli releases finalize "${SHA}" || true
        continue-on-error: true

      # Auto-redeploy staging via SSH. Replaces the prior Portainer webhook
      # trigger (Portainer's API surface for stack updates was too unstable
      # across CE versions). The host writes /opt/<slug>/.env on first
      # /deploy; this step sets IMAGE_TAG=sha-<short> in that .env and runs
      # `docker compose pull && up -d`. GHCR auth comes from the host's
      # /root/.docker/config.json (seeded by cloud-init).
      #
      # Skip silently when STAGING_HOST is unset: a fork that has not yet
      # run /deploy --env staging has no host to redeploy to. The image is
      # still built and pushed to GHCR above; /deploy reads it on first run.
      - name: Install SSH key
        if: ${{ success() && vars.STAGING_HOST != '' && env.HAS_SSH == 'true' }}
        env:
          HAS_SSH: ${{ secrets.SSH_PRIVATE_KEY != '' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Redeploy staging via SSH
        if: ${{ success() && vars.STAGING_HOST != '' && env.HAS_SSH == 'true' }}
        env:
          HAS_SSH: ${{ secrets.SSH_PRIVATE_KEY != '' }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_SLUG: ${{ vars.STAGING_SLUG }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          SLUG="${STAGING_SLUG:-app}"
          DIR="/opt/${SLUG}"
          echo "Redeploying ${SLUG} on ${STAGING_HOST} with IMAGE_TAG=sha-${SHORT_SHA}"
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR -o ConnectTimeout=10 \
              -i ~/.ssh/id_ed25519 "root@${STAGING_HOST}" bash <<EOF
          set -euo pipefail
          if grep -q '^IMAGE_TAG=' '${DIR}/.env'; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=sha-${SHORT_SHA}|" '${DIR}/.env'
          else
            echo "IMAGE_TAG=sha-${SHORT_SHA}" >> '${DIR}/.env'
          fi
          cd '${DIR}'
          docker compose -f docker-compose.prod.yml --env-file .env pull
          docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
          EOF
          echo "Staging redeploy complete."
