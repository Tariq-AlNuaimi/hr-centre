name: Build & Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # IMAGE_TAG is passed on the webhook query string. Portainer STACK webhooks
      # treat query-string params as environment-variable overrides for the stack,
      # so docker-compose.prod.yml's `${IMAGE_TAG:-latest}` resolves to the SHA tag
      # on this deploy. SERVICE webhooks ignore the query string -- they redeploy
      # whatever :latest currently points to, which is also fine (just no SHA pin).
      # See SECURITY.md finding T-04.
      - name: Trigger Portainer stack update
        if: success()
        env:
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          curl -s -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}?IMAGE_TAG=sha-${SHORT_SHA}"
          echo "Portainer webhook triggered with IMAGE_TAG=sha-${SHORT_SHA}"
