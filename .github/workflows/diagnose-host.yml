name: Diagnose host

# One-shot SSH-based diagnostics for a deployed env. Useful when:
#   - Caddy is stuck on cert acquisition
#   - Docker compose stack misbehaves
#   - Operator needs to inspect logs without local terminal access
#
# Optional restart toggle for Caddy (LE rate-limit reset, config reload).

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment (staging | prod)'
        type: choice
        options: [staging, prod]
        default: staging
        required: true
      restart_caddy:
        description: 'Restart caddy.service after dumping logs (use if Caddy is stuck on LE cert acquisition)'
        type: boolean
        default: false
      compose_logs:
        description: 'Also dump `docker compose logs` for the app stack'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/restore-state
        with:
          env: ${{ inputs.env }}

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is empty." >&2
            exit 1
          fi
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Read droplet IP from state
        id: state
        env:
          INPUT_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          FILE=".deploy-state.${INPUT_ENV}.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::State file $FILE not found on orphan branch." >&2
            exit 1
          fi
          IP=$(node -e "console.log(require('./$FILE').droplet.ip)")
          SLUG=$(node -e "console.log(require('./$FILE').slug)")
          echo "ip=${IP}" >> "$GITHUB_OUTPUT"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "Host: ${IP}  Slug: ${SLUG}"

      - name: Caddy status + recent logs
        env:
          HOST: ${{ steps.state.outputs.ip }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR -o ConnectTimeout=10 \
              -i ~/.ssh/id_ed25519 "root@${HOST}" bash <<'EOF'
          set -e
          echo "===== systemctl status caddy ====="
          systemctl status caddy --no-pager --lines=0 || true
          echo
          echo "===== journalctl -u caddy -n 80 ====="
          journalctl -u caddy -n 80 --no-pager || true
          echo
          echo "===== /etc/caddy/Caddyfile ====="
          cat /etc/caddy/Caddyfile
          echo
          echo "===== ss -ltnp ====="
          ss -ltnp | grep -E ':80|:443|:3000' || true
          echo
          echo "===== ufw status ====="
          ufw status verbose | head -25
          EOF

      - name: Compose logs (if requested)
        if: ${{ inputs.compose_logs }}
        env:
          HOST: ${{ steps.state.outputs.ip }}
          SLUG: ${{ steps.state.outputs.slug }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR -o ConnectTimeout=10 \
              -i ~/.ssh/id_ed25519 "root@${HOST}" bash <<EOF
          set -e
          echo "===== docker compose ps ====="
          cd /opt/${SLUG} && docker compose -f docker-compose.prod.yml --env-file .env ps
          echo
          echo "===== docker compose logs --tail 100 (last 100 lines per service) ====="
          docker compose -f docker-compose.prod.yml --env-file .env logs --tail 100 --no-color
          EOF

      - name: Restart Caddy (if requested)
        if: ${{ inputs.restart_caddy }}
        env:
          HOST: ${{ steps.state.outputs.ip }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR -o ConnectTimeout=10 \
              -i ~/.ssh/id_ed25519 "root@${HOST}" bash <<'EOF'
          set -e
          echo "Stopping caddy + clearing LE backoff state..."
          systemctl stop caddy
          # Clear any cached LE failure state so Caddy retries immediately on start.
          # This does NOT delete acquired certs (those live in /var/lib/caddy/.local/share/caddy/certificates/).
          rm -rf /var/lib/caddy/.local/share/caddy/acme/*/locks 2>/dev/null || true
          systemctl start caddy
          sleep 2
          systemctl status caddy --no-pager --lines=0
          echo
          echo "===== journalctl -u caddy -n 40 (post-restart) ====="
          journalctl -u caddy -n 40 --no-pager
          EOF
