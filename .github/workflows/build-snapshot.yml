name: Build base snapshot

# One-time (per region) pre-bake of a DO custom image with Docker + Caddy +
# age + rclone pre-installed, plus pulled base Docker images. Subsequent
# /deploy runs read DO_BASE_SNAPSHOT_ID_<REGION> and boot droplets from this
# snapshot, skipping the ~4 min apt-install phase of cloud-init.
#
# Idempotent: re-running detects an existing snapshot and just (re)sets the
# repo variable. Use force_rebuild=true to refresh (e.g. for security updates).
#
# See scripts/build-snapshot.mjs + deploy/cloud-init-base.yml + .claude/skills/build-snapshot.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'DO region to build the snapshot in (snapshots are region-locked)'
        type: choice
        options: [fra1, ams3, nyc3, sfo3, sgp1, blr1, syd1, lon1, tor1]
        default: fra1
      force_rebuild:
        description: 'Destroy + rebuild even if a snapshot already exists for this region'
        type: boolean
        default: false

concurrency:
  group: build-snapshot-${{ inputs.region }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is empty. Set it on the repo (see /first-fork)." >&2
            exit 1
          fi
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Build snapshot
        env:
          CI: 'true'
          NON_INTERACTIVE: 'true'
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          SSH_PUBKEY: ${{ vars.SSH_PUBKEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_REGION: ${{ inputs.region }}
          INPUT_FORCE: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          ARGS=(--region "$INPUT_REGION" --yes)
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS+=(--force-rebuild)
          fi
          node scripts/build-snapshot.mjs "${ARGS[@]}"
