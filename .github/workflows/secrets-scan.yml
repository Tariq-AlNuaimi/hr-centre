# DORMANT on the free GitHub plan (Actions billing blocked): this workflow does not run.
# The gitleaks scan is mirrored locally by the /ship skill. Activates at /handoff when the
# IT team's paid plan runs Actions. See SECURITY.md §14 / ADR-007.
name: Secrets scan

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs full history to scan past commits, not just the diff.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        # --config picks up the project-local .gitleaks.toml, which allowlists
        # .deploy-state.*.json on the orphan deployment-state branch (generated
        # secrets persisted there by design -- see .gitleaks.toml for the
        # threat-model rationale).
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose
