# DORMANT on the free GitHub plan (Actions billing blocked): this workflow does not run.
# The gitleaks scan is mirrored locally by the /ship skill. Activates at /handoff when the
# IT team's paid plan runs Actions. See SECURITY.md §14 / ADR-007.
#
# Triggers are set to workflow_dispatch (manual) only so the job does not auto-run and
# fail-in-2s on a billing-blocked plan. AT HANDOFF: restore the real triggers below.
name: Secrets scan

on:
  workflow_dispatch:
  # Restore at handoff (paid Actions):
  # pull_request:
  # push:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs full history to scan past commits, not just the diff.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        # --config picks up the project-local .gitleaks.toml (extends the default
        # ruleset). The pre-pivot deployment-state allowlist was removed with the
        # ADR-006 cleanup -- the Vercel/Neon rail persists no generated secrets in
        # the repo, so the default ruleset applies as-is.
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose
