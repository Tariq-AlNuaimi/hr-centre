name: Bootstrap backup secrets

# One-click setup of the three backup-related repo secrets:
#   - BACKUP_AGE_IDENTITY  : age private key (decrypts backups)
#   - BACKUP_AGE_RECIPIENT : age public key  (encrypts backups)
#   - RCLONE_CONFIG        : rclone.conf with DO Spaces access keys
#
# Generates the age keypair on the runner (never leaves CI), creates a
# new DO Spaces access key via DO API, builds the rclone INI, and writes
# all three as libsodium-encrypted GH repo secrets. Operator never
# touches a terminal.
#
# By default, skips secrets that already exist. Set `regenerate=true`
# to rotate them (WARNING: rotating BACKUP_AGE_IDENTITY makes prior
# backups undecryptable -- do this only when starting fresh).

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: 'Overwrite existing secrets? (Rotates the age keypair; old backups become undecryptable.)'
        type: boolean
        default: false
      spaces_region:
        description: 'DO Spaces region for backups'
        type: choice
        options: [fra1, nyc3, sfo3, sgp1, ams3, syd1]
        default: fra1

concurrency:
  group: bootstrap-secrets
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: npm ci

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y age

      - name: Generate + set secrets
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_REGENERATE: ${{ inputs.regenerate }}
          INPUT_REGION: ${{ inputs.spaces_region }}
        run: node scripts/bootstrap-backup-secrets.mjs
