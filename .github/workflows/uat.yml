# UAT — browser acceptance tests (Playwright) against a deployed URL.
#
# DORMANT on the free GitHub plan (Actions billing blocked): this workflow does
# not run until Actions is enabled (a paid plan, or a public repo). See
# SECURITY.md / ADR-007 for how the other workflows sit dormant the same way.
#
# Manual-first BY DESIGN: once Actions is enabled, run it from the GitHub
# website — Actions tab -> "UAT" -> "Run workflow" — no terminal, any machine.
# The screenshot report is uploaded as a downloadable artifact on the run page.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   UAT_BASE_URL   deployed URL to test (e.g. https://your-app.vercel.app)
#   UAT_EMAIL      a UAT login (or set SEED_ADMIN_EMAIL)
#   UAT_PASSWORD   its password   (or set SEED_ADMIN_PASSWORD)
name: UAT

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target URL (optional; overrides the UAT_BASE_URL secret)"
        required: false
  # Optional nightly run once Actions is enabled — uncomment to schedule:
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Cache the Playwright browser download so reruns skip the ~100MB fetch.
      # Keyed on the @playwright/test version in the lockfile so a Playwright
      # bump (which can require a new browser build) busts the cache.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Chromium
        # On a cache hit the browser binary is already present; still run with
        # --with-deps so the OS-level libraries (never cached) are installed.
        run: npx playwright install --with-deps chromium

      - name: Run UAT
        env:
          UAT_BASE_URL: ${{ github.event.inputs.base_url || secrets.UAT_BASE_URL }}
          UAT_EMAIL: ${{ secrets.UAT_EMAIL }}
          UAT_PASSWORD: ${{ secrets.UAT_PASSWORD }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: npm run uat

      - name: Upload UAT report (screenshots)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uat-report
          path: uat-report/
          retention-days: 30
