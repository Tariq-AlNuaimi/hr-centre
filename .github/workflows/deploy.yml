name: Deploy

# Operator-triggered provisioning + deploy. Replaces the previous
# "Claude executes scripts/deploy.mjs locally" flow. See ADR-004.

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment (staging | prod)'
        type: choice
        options: [staging, prod]
        required: true
      domain:
        description: 'Domain (e.g. app.example.com)'
        required: true
      slug:
        description: 'Project slug (kebab-case). Defaults to package.json name.'
        required: false
      action:
        description: 'Action to perform'
        type: choice
        options: [provision-and-deploy, redeploy, destroy]
        default: provision-and-deploy

concurrency:
  group: deploy-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/restore-state
        with:
          env: ${{ inputs.env }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install SSH key + verify pair matches SSH_PUBKEY
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBKEY: ${{ vars.SSH_PUBKEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is empty. Set it on the repo (see /first-fork)." >&2
            exit 1
          fi
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ -n "${SSH_PUBKEY}" ]; then
            # Try with empty passphrase first; capture stderr so we can surface
            # the real reason ssh-keygen rejects the key.
            derived="$(ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 2>/tmp/sshkeygen.err || true)"
            if [ -z "${derived}" ]; then
              keygen_err="$(cat /tmp/sshkeygen.err 2>/dev/null || true)"
              # Structural diagnostics. None of these leak the key body --
              # BEGIN/END markers and byte counts are not sensitive.
              echo "::error::Could not parse SSH_PRIVATE_KEY (ssh-keygen -y failed)." >&2
              if [ -n "${keygen_err}" ]; then
                echo "::error::ssh-keygen stderr: ${keygen_err}" >&2
                if printf '%s' "${keygen_err}" | grep -qi 'passphrase\|incorrect passphrase\|bad passphrase'; then
                  echo "::error::The key is encrypted with a passphrase. CI cannot prompt for it." >&2
                  echo "::error::Remedy: strip the passphrase locally and re-upload:" >&2
                  echo "::error::  ssh-keygen -p -f \$HOME\\.ssh\\vibe_automation -P '<old-passphrase>' -N ''" >&2
                  echo "::error::  gh secret set SSH_PRIVATE_KEY --repo Tariq-AlNuaimi/fullstack-vibe-template --body-file \$HOME\\.ssh\\vibe_automation" >&2
                  exit 1
                fi
              fi
              echo "::error::Diagnostics on the written file:" >&2
              bytes=$(wc -c < ~/.ssh/id_ed25519 | tr -d ' ')
              lines=$(wc -l < ~/.ssh/id_ed25519 | tr -d ' ')
              echo "::error::  bytes=${bytes}  lines=${lines}" >&2
              if head -1 ~/.ssh/id_ed25519 | grep -q '^-----BEGIN'; then
                first="$(head -1 ~/.ssh/id_ed25519)"
                echo "::error::  first line: ${first}" >&2
              else
                echo "::error::  first line is NOT a BEGIN marker -- secret is truncated or wrong format" >&2
              fi
              if tail -1 ~/.ssh/id_ed25519 | grep -q -- '-----END'; then
                last="$(tail -1 ~/.ssh/id_ed25519)"
                echo "::error::  last line:  ${last}" >&2
              else
                echo "::error::  last line is NOT an END marker -- secret is truncated or had trailing whitespace stripped" >&2
              fi
              if grep -q $'\r' ~/.ssh/id_ed25519; then
                echo "::error::  contains CRLF line endings -- re-export from a Linux/macOS shell, not Notepad" >&2
              fi
              if [ "${lines}" -lt 4 ]; then
                echo "::error::  fewer than 4 lines -- the multi-line key probably got collapsed to one line on paste" >&2
              fi
              echo "::error::Remedy: from PowerShell where the key lives, run:" >&2
              echo "::error::  gh secret set SSH_PRIVATE_KEY --repo Tariq-AlNuaimi/fullstack-vibe-template --body-file \$HOME\\.ssh\\id_ed25519" >&2
              exit 1
            fi
            derived_body="$(printf '%s' "${derived}"  | awk '{print $2}')"
            configured_body="$(printf '%s' "${SSH_PUBKEY}" | awk '{print $2}')"
            if [ "${derived_body}" != "${configured_body}" ]; then
              echo "::error::SSH_PRIVATE_KEY does not correspond to SSH_PUBKEY." >&2
              echo "::error::Derived from secret  : ${derived}" >&2
              echo "::error::Configured in vars   : ${SSH_PUBKEY}" >&2
              echo "::error::Either set SSH_PRIVATE_KEY to the private half of SSH_PUBKEY, or update SSH_PUBKEY to match the key you have." >&2
              exit 1
            fi
            echo "SSH key pair verified."
          fi

      - name: Run deploy script
        env:
          CI: 'true'
          NON_INTERACTIVE: 'true'
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          GITHUB_FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETTER_UPTIME_API_KEY: ${{ secrets.BETTER_UPTIME_API_KEY }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          CADDY_EMAIL: ${{ vars.CADDY_EMAIL }}
          SSH_PUBKEY: ${{ vars.SSH_PUBKEY }}
          INPUT_ENV: ${{ inputs.env }}
          INPUT_DOMAIN: ${{ inputs.domain }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          ARGS=(--env "$INPUT_ENV" --domain "$INPUT_DOMAIN" --yes)
          if [ -n "$INPUT_SLUG" ]; then
            ARGS+=(--slug "$INPUT_SLUG")
          fi
          case "$INPUT_ACTION" in
            provision-and-deploy) ;;
            redeploy)             ARGS+=(--skip-provision) ;;
            destroy)              ARGS+=(--destroy) ;;
          esac
          node scripts/deploy.mjs "${ARGS[@]}"

      - name: Persist deployment state
        if: always()
        uses: ./.github/actions/persist-state
        with:
          env: ${{ inputs.env }}
          message: 'after ${{ inputs.action }} (run #${{ github.run_number }})'
