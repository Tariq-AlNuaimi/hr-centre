name: Preflight

# Validate every secret /deploy needs by hitting the real vendor APIs.
# Catches missing / mis-scoped / pair-mismatched secrets in ~60s instead of
# 15+ minutes into deploy.yml. Run this BEFORE /deploy on a fresh fork (and
# whenever you rotate a token).
#
# Exit codes:
#   0  all required-for-env secrets pass
#   1  at least one required secret missing or invalid
#
# See scripts/preflight.mjs.

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to validate against'
        type: choice
        options: [staging, prod]
        required: true
      domain:
        description: 'Domain (optional; enables Cloudflare zone probe)'
        required: false

concurrency:
  group: preflight-${{ inputs.env }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # scripts/lib/github.mjs uses libsodium-wrappers (runtime dep). Install
      # only what's needed -- the rest of the matrix is just fetch().
      - run: npm ci

      - name: Run preflight
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBKEY: ${{ vars.SSH_PUBKEY }}
          CADDY_EMAIL: ${{ vars.CADDY_EMAIL }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          BETTER_UPTIME_API_KEY: ${{ secrets.BETTER_UPTIME_API_KEY }}
          DO_BASE_SNAPSHOT_ID_FRA1: ${{ vars.DO_BASE_SNAPSHOT_ID_FRA1 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_ENV: ${{ inputs.env }}
          INPUT_DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          ARGS=(--env "$INPUT_ENV")
          if [ -n "${INPUT_DOMAIN:-}" ]; then
            ARGS+=(--domain "$INPUT_DOMAIN")
          fi
          node scripts/preflight.mjs "${ARGS[@]}"
