name: Audit retention

on:
  schedule:
    # Monthly at 03:00 UTC on the 1st
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Call audit-purge endpoint
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          TOKEN: ${{ secrets.AUDIT_PURGE_TOKEN }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$TOKEN" ]; then
            echo "::warning::PROD_BASE_URL or AUDIT_PURGE_TOKEN secret not set -- skipping"
            echo "Configure both in repo Settings > Secrets and variables > Actions to enable"
            exit 0
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "x-internal-token: ${TOKEN}" \
            -H "content-length: 0" \
            "${BASE_URL%/}/api/internal/audit-purge")
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP ${status}"
          echo "$body"
          if [ "$status" -ne 200 ]; then
            echo "::error::audit-purge returned non-200"
            exit 1
          fi
