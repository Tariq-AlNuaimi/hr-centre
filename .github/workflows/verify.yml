# DORMANT on the free GitHub plan (Actions billing blocked): this workflow does not run.
# Its checks are mirrored locally by the /ship skill. Activates at /handoff when the IT
# team's paid plan runs Actions. See SECURITY.md §14 / ADR-007.
#
# Triggers are set to workflow_dispatch (manual) only so the job does not auto-run and
# fail-in-2s on a billing-blocked plan. AT HANDOFF: restore the real triggers below.
name: Verify

on:
  workflow_dispatch:
  # Restore at handoff (paid Actions):
  # pull_request:
  # push:
  #   branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy URL so prisma generate works without a real DB.
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  AUTH_SECRET: build-time-dummy-secret-do-not-use-in-prod-build-only

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test (contract suite)
        run: npm test

      - name: Test (component suite)
        run: npm run test:components

      # Cache Next's build cache so incremental builds reuse compiled output.
      # Keyed on lockfile + source so a dep or code change busts it; restore-keys
      # let an older cache seed a partial hit.
      - name: Cache Next build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        run: npm run build

      # npm audit gate -- matches the active `/ship` bar (`--audit-level=high`).
      #
      # Previously pinned to `critical` because `high` flagged the next-auth@beta
      # -> @auth/core -> old nodemailer chain. That chain was remediated
      # (2026-06-05, SECURITY.md §13): `overrides` pin uuid/postcss/@hono and a
      # nodemailer 7->8 bump cleared all 14 advisories, so `high` is now clean.
      # Keeping CI and `/ship` at the same threshold (high) avoids doc drift.
      - name: npm audit (high, prod deps only)
        run: npm audit --audit-level=high --omit=dev

      # Smoke 1: scalar-only entity
      - name: Scaffold smoke (scalars only)
        run: |
          npm run scaffold -- --name TestEntity --fields 'title:string,note:string?'
          npx prisma generate
          npx tsc --noEmit
          git checkout prisma/schema.prisma \
            lib/prisma/soft-delete-extension.ts \
            lib/prisma/recyclable.ts \
            components/layout/AppSidebar.tsx \
            messages/en.json \
            messages/ar.json
          rm -rf lib/validations/test-entity.ts \
            app/api/test-entity \
            components/test-entity \
            'app/[locale]/(dashboard)/test-entity'

      # Smoke 2: entity with enums + a relation (exercises the new codegen paths)
      - name: Scaffold smoke (enums + relations)
        run: |
          npm run scaffold -- --name TestRel \
            --fields 'title:string' \
            --enums 'state:OPEN|CLOSED' \
            --relations 'owner:User?'
          npx prisma generate
          npx tsc --noEmit
          git checkout prisma/schema.prisma \
            lib/prisma/soft-delete-extension.ts \
            lib/prisma/recyclable.ts \
            components/layout/AppSidebar.tsx \
            messages/en.json \
            messages/ar.json
          rm -rf lib/validations/test-rel.ts \
            app/api/test-rel \
            components/test-rel \
            'app/[locale]/(dashboard)/test-rel'

      # Smoke 3: --writes editor (exercises the withEditorAuth codegen path)
      - name: Scaffold smoke (--writes editor)
        run: |
          npm run scaffold -- --name TestEd --fields 'title:string' --writes editor
          grep -q 'withEditorAuth' app/api/test-ed/route.ts
          npx prisma generate
          npx tsc --noEmit
          git checkout prisma/schema.prisma \
            lib/prisma/soft-delete-extension.ts \
            lib/prisma/recyclable.ts \
            components/layout/AppSidebar.tsx \
            messages/en.json \
            messages/ar.json
          rm -rf lib/validations/test-ed.ts \
            app/api/test-ed \
            components/test-ed \
            'app/[locale]/(dashboard)/test-ed'
