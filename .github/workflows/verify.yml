# DORMANT on the free GitHub plan (Actions billing blocked): this workflow does not run.
# Its checks are mirrored locally by the /ship skill. Activates at /handoff when the IT
# team's paid plan runs Actions. See SECURITY.md §14 / ADR-007.
#
# Triggers are set to workflow_dispatch (manual) only so the job does not auto-run and
# fail-in-2s on a billing-blocked plan. AT HANDOFF: restore the real triggers below.
name: Verify

on:
  workflow_dispatch:
  # Restore at handoff (paid Actions):
  # pull_request:
  # push:
  #   branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy URL so prisma generate works without a real DB.
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  AUTH_SECRET: build-time-dummy-secret-do-not-use-in-prod-build-only

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test (contract suite)
        run: npm test

      - name: Build
        run: npm run build

      # npm audit gate.
      #
      # `--audit-level=critical` -- the high-only threshold flagged transitive
      # vulns through next-auth@beta's nested @auth/core -> old nodemailer chain
      # that a fork consumer can't fully resolve. The `overrides` field forces
      # all resolutions to nodemailer ^7, but @auth/core itself carries
      # advisories until next-auth ships a non-beta release.
      #
      # Documented as a deferred-finding in SECURITY.md §11.
      - name: npm audit (critical, prod deps only)
        run: npm audit --audit-level=critical --omit=dev

      # Smoke 1: scalar-only entity
      - name: Scaffold smoke (scalars only)
        run: |
          npm run scaffold -- --name TestEntity --fields 'title:string,note:string?'
          npx prisma generate
          npx tsc --noEmit
          git checkout -- prisma/schema.prisma \
            lib/prisma/soft-delete-extension.ts \
            lib/prisma/recyclable.ts \
            components/layout/AppSidebar.tsx
          rm -rf lib/validations/test-entity.ts \
            app/api/test-entity \
            components/test-entity \
            'app/[locale]/(dashboard)/test-entity'

      # Smoke 2: entity with enums + a relation (exercises the new codegen paths)
      - name: Scaffold smoke (enums + relations)
        run: |
          npm run scaffold -- --name TestRel \
            --fields 'title:string' \
            --enums 'state:OPEN|CLOSED' \
            --relations 'owner:User?'
          npx prisma generate
          npx tsc --noEmit
          git checkout -- prisma/schema.prisma \
            lib/prisma/soft-delete-extension.ts \
            lib/prisma/recyclable.ts \
            components/layout/AppSidebar.tsx
          rm -rf lib/validations/test-rel.ts \
            app/api/test-rel \
            components/test-rel \
            'app/[locale]/(dashboard)/test-rel'
