name: Verify

on:
  pull_request:
  push:
    branches-ignore: [main]

env:
  # Dummy URL so prisma generate works without a real DB. Matches the trick used
  # in the Dockerfile builder stage.
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  # Build-time env vars that lib/env.ts requires for module load. Real values
  # are injected at deploy time -- these are placeholders that satisfy zod parsing.
  AUTH_SECRET: build-time-dummy-secret-do-not-use-in-prod-build-only
  MINIO_ENDPOINT: http://localhost:9000
  MINIO_ACCESS_KEY: dummy
  MINIO_SECRET_KEY: dummy
  MINIO_BUCKET: uploads

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test (contract suite)
        run: npm test

      - name: Build
        run: npm run build

      - name: npm audit (high+, prod deps only)
        run: npm audit --audit-level=high --omit=dev

      # Smoke 1: scalar-only entity
      - name: Scaffold smoke (scalars only)
        run: |
          npm run scaffold -- --name TestEntity --fields 'title:string,note:string?'
          npx prisma generate
          npx tsc --noEmit
          git checkout -- prisma/schema.prisma \
            lib/prisma/soft-delete-extension.ts \
            app/api/recycling-bin/route.ts \
            components/layout/AppSidebar.tsx
          rm -rf lib/validations/test-entity.ts \
            app/api/test-entity \
            components/test-entity \
            'app/[locale]/(dashboard)/test-entity'

      # Smoke 2: entity with enums + a relation (exercises the new codegen paths)
      - name: Scaffold smoke (enums + relations)
        run: |
          npm run scaffold -- --name TestRel \
            --fields 'title:string' \
            --enums 'state:OPEN|CLOSED' \
            --relations 'owner:User?'
          npx prisma generate
          npx tsc --noEmit
          git checkout -- prisma/schema.prisma \
            lib/prisma/soft-delete-extension.ts \
            app/api/recycling-bin/route.ts \
            components/layout/AppSidebar.tsx
          rm -rf lib/validations/test-rel.ts \
            app/api/test-rel \
            components/test-rel \
            'app/[locale]/(dashboard)/test-rel'
