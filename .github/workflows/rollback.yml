name: Rollback

# Flip the live docker compose stack's IMAGE_TAG to a known-good SHA via
# SSH + `docker compose pull && up -d`. Pure image swap; does not touch
# the DB. See ADR-004 + scripts/rollback.mjs.

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to roll back (staging | prod)'
        type: choice
        options: [staging, prod]
        required: true
      slug:
        description: 'Project slug (kebab-case). Defaults to package.json name.'
        required: false
      to_sha:
        description: 'Target SHA (7+ chars) or "sha-<short>" or "latest"'
        required: true

concurrency:
  group: rollback-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/restore-state
        with:
          env: ${{ inputs.env }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is empty. Set it on the repo (see /first-fork)." >&2
            exit 1
          fi
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Run rollback script
        env:
          CI: 'true'
          NON_INTERACTIVE: 'true'
          GITHUB_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          GITHUB_FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ENV: ${{ inputs.env }}
          INPUT_TO_SHA: ${{ inputs.to_sha }}
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          ARGS=(--env "$INPUT_ENV" --to "$INPUT_TO_SHA" --yes)
          if [ -n "$INPUT_SLUG" ]; then
            ARGS+=(--slug "$INPUT_SLUG")
          fi
          node scripts/rollback.mjs "${ARGS[@]}"
