# DORMANT on the free GitHub plan (Actions billing blocked): this manual provisioner cannot
# run. Until billing is restored, use /first-fork (manual on-ramp) instead. See ADR-007.
name: New Project

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Kebab-case slug (e.g. "staffing"). Becomes <slug>.<apex>.'
        required: true
        type: string
      display_name:
        description: 'Human-readable name (e.g. "Staffing"). Defaults to slug.'
        required: false
        type: string
      admin_email:
        description: 'Admin email for the seeded user.'
        required: true
        type: string

jobs:
  new-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Provision new project
        env:
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Untrusted workflow_dispatch inputs are passed via env and referenced
          # as quoted shell vars -- never interpolated into the run: script --
          # to close the GitHub Actions script-injection sink. This job holds
          # repo-creating + cloud tokens, so the sink would be high-value.
          IN_SLUG: ${{ inputs.slug }}
          IN_DISPLAY_NAME: ${{ inputs.display_name }}
          IN_ADMIN_EMAIL: ${{ inputs.admin_email }}
          IN_APEX: ${{ vars.APEX_DOMAIN || 'ops-rihal.com' }}
          IN_OWNER: ${{ vars.GH_OWNER || github.repository_owner }}
          IN_NEON_REGION: ${{ vars.NEON_REGION || 'aws-eu-central-1' }}
        run: |
          node scripts/new-project.mjs \
            --slug "$IN_SLUG" \
            --display-name "${IN_DISPLAY_NAME:-$IN_SLUG}" \
            --admin-email "$IN_ADMIN_EMAIL" \
            --apex "$IN_APEX" \
            --owner "$IN_OWNER" \
            --neon-region "$IN_NEON_REGION" \
            >> "$GITHUB_STEP_SUMMARY"
