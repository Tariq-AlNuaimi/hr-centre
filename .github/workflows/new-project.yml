name: New Project

# Take a Claude-authored plan JSON committed at plans/<timestamp>-<slug>.json
# and run the new-project orchestrator (repo create -> rebrand -> scaffold ->
# deploy-staging). See ADR-004 + .claude/skills/new-project/SKILL.md.

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: 'Path to the plan JSON (e.g. plans/20260518-1700-task-tracker.json)'
        required: true

concurrency:
  group: new-project
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  new-project:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate plan exists
        env:
          INPUT_PLAN_PATH: ${{ inputs.plan_path }}
        run: |
          set -euo pipefail
          if [ ! -f "$INPUT_PLAN_PATH" ]; then
            echo "ERROR: plan file not found: $INPUT_PLAN_PATH" >&2
            exit 1
          fi
          # Sanity-check it parses.
          node -e "JSON.parse(require('fs').readFileSync(process.env.INPUT_PLAN_PATH,'utf8'))"

      - uses: ./.github/actions/restore-state
        with:
          env: staging

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "${SSH_PRIVATE_KEY}" ]; then
            printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          fi
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run new-project orchestrator
        env:
          CI: 'true'
          NON_INTERACTIVE: 'true'
          # --- Used by the orchestrator's own logic (deploy invocation, etc.)
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          GITHUB_FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETTER_UPTIME_API_KEY: ${{ secrets.BETTER_UPTIME_API_KEY }}
          # --- Bootstrap secrets propagated to the new fork (see
          # BOOTSTRAP_SECRETS in scripts/new-project.mjs). Must stay in
          # lockstep with .claude/skills/first-fork/SKILL.md §3.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          # --- Bootstrap variables propagated to the new fork
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          CADDY_EMAIL: ${{ vars.CADDY_EMAIL }}
          SSH_PUBKEY: ${{ vars.SSH_PUBKEY }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          CF_ZONE: ${{ vars.CF_ZONE }}
          INPUT_PLAN_PATH: ${{ inputs.plan_path }}
        run: |
          node scripts/new-project.mjs --plan "$INPUT_PLAN_PATH" --yes

      - name: Persist staging state
        if: always()
        uses: ./.github/actions/persist-state
        with:
          env: staging
          message: 'after new-project (run #${{ github.run_number }})'
