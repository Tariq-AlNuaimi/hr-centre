name: Feature proposal
description: Propose new capability or a meaningful change to existing behavior.
labels: ["feature"]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the change.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Who feels the pain today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: High-level shape. Files / surfaces touched. New deps if any.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: At least one. "None" needs to argue why no other option was viable.
    validations:
      required: true

  - type: dropdown
    id: security-impact
    attributes:
      label: SECURITY.md impact
      description: Does this touch auth / roles / data classification / encryption / audit / secrets / retention / external network calls?
      options:
        - No impact
        - Internal-class data only
        - Confidential-class data
        - Restricted-class data (requires ADR + SCRUB_FIELDS extension if columnar)
      default: 0
    validations:
      required: true

  - type: dropdown
    id: adr-needed
    attributes:
      label: ADR required?
      description: "Stack changes, new external integrations, or any decision that future forks will want to know the reasoning of — yes."
      options:
        - "No"
        - "Yes — will open ADR-NNN as part of this work"
      default: 0

  - type: checkboxes
    id: confirmation
    attributes:
      label: Pre-submit checklist
      options:
        - label: I checked CLAUDE.md hard rules to confirm none are bypassed (or the bypass is justified above)
          required: true
        - label: I checked SECURITY.md §11 for related findings
          required: true
