name: Restore deployment state
description: |
  Fetch the orphan `deployment-state` branch (if it exists) and copy
  `.deploy-state.<env>.json` into the workspace so scripts can read it.

  See docs/decisions/ADR-004-ci-driven-ops.md for the state-branch model.

inputs:
  env:
    description: 'Environment name (staging | prod)'
    required: true

runs:
  using: composite
  steps:
    - name: Fetch deployment-state branch (if any)
      shell: bash
      run: |
        set -euo pipefail
        # Branch may not yet exist on the very first run; ignore failure.
        git fetch origin deployment-state:deployment-state 2>/dev/null || true
        STATE_FILE=".deploy-state.${{ inputs.env }}.json"
        if git rev-parse --verify deployment-state >/dev/null 2>&1; then
          if git show "deployment-state:${STATE_FILE}" >/dev/null 2>&1; then
            git show "deployment-state:${STATE_FILE}" > "${STATE_FILE}"
            echo "Restored ${STATE_FILE} from deployment-state branch."
          else
            echo "No ${STATE_FILE} on deployment-state branch yet -- fresh env."
          fi
        else
          echo "deployment-state branch does not exist yet -- fresh repo."
        fi
