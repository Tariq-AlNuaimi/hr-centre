# Dependabot keeps dependencies patched. Like the workflows, this is most useful
# once the project is on a plan that runs Actions (it opens PRs that CI then
# gates). Grouped to keep PR noise low. See SECURITY.md §13 (CVE remediations).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps; majors come as individual PRs.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Majors locked by ADR-001 -- bumping any of these requires a superseding
      # ADR (see CLAUDE.md "Ask before"), so Dependabot must not propose them.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "global-jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # next is exact-pinned and bumped deliberately (known-trap note in CLAUDE.md);
      # its toolchain siblings move in lockstep with it, not via Dependabot.
      - dependency-name: "next"
      - dependency-name: "eslint-config-next"
      - dependency-name: "@next/bundle-analyzer"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
