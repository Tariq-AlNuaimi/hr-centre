# Development compose - pull GHCR image for local testing
# Usage: docker compose up -d

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_secret
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: app_minio
      MINIO_ROOT_PASSWORD: app_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set app http://minio:9000 app_minio app_minio_secret;
        mc mb app/uploads --ignore-existing;
        echo 'Bucket uploads created';
      "
    restart: "no"

  app:
    image: ghcr.io/rihal-om/fullstack-next-template:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://app:app_secret@db:5432/app_db?schema=public"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "app_minio"
      MINIO_SECRET_KEY: "app_minio_secret"
      MINIO_BUCKET: "uploads"
      AUTH_SECRET: "dev-secret-change-in-production"
      AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_NAME: "My App"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      SEED_ADMIN_EMAIL: "admin@example.com"
      SEED_ADMIN_PASSWORD: "changeme"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  miniodata:
