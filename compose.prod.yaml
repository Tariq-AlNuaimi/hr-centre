# Production self-host topology (ADR-035 — Docker-first delivery, one dockerized
# deployment per tenant). Caddy terminates TLS and reverse-proxies to the app;
# the app runs migrations at startup then serves; Postgres is bundled by default.
#
# TWO DB PROFILES (operator decision: bundled DB is the DEFAULT):
#
#   Bundled Postgres (default — app + Caddy + pgvector Postgres):
#     docker compose -f compose.prod.yaml --profile bundled-db up -d
#     (this is what `make docker-prod-up` runs)
#
#   External / managed Postgres (app + Caddy only; skip the bundled db and point
#   DATABASE_URL at Neon / RDS / any managed Postgres in .env):
#     docker compose -f compose.prod.yaml --profile external-db up -d
#
# The `db` service is gated behind the `bundled-db` profile, so the external-db
# profile (and a bare `up` with no profile) starts app + Caddy only. `app`'s
# dependency on `db` is `required: false`, so it does not error when the bundled
# db is disabled.
#
# OBSERVABILITY (optional — ADR-040). The `observability` profile adds an
# OpenTelemetry Collector (the swappable-backend seam). Combine it with a DB
# profile, e.g.:
#   docker compose -f compose.prod.yaml --profile bundled-db --profile observability up -d
# then point the app at it: OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318.
# Unset that env and the whole backbone is a silent no-op (app is unaffected).
#
# ENTERPRISE IDENTITY (optional — ADR-045, WS-6). The `sso` profile adds an Ory
# Polis sidecar (SAML→OIDC bridge + SCIM 2.0). Combine it with a DB profile, e.g.:
#   docker compose -f compose.prod.yaml --profile bundled-db --profile sso up -d
# then set POLIS_* (SSO) / SCIM_INTERNAL_SECRET (provisioning) in .env. Unset those
# and identity is a silent no-op (SSO dormant, SCIM endpoint returns skipped).
#
# PUBLIC INGRESS (ADR-045 amendment A2): Polis's OIDC + SAML-callback endpoints must
# be browser- and IdP-reachable, so Caddy fronts the sidecar on its OWN hostname.
# Set POLIS_DOMAIN to that hostname (the Caddyfile `sso` site block proxies it to
# polis:5225) and set POLIS_EXTERNAL_URL below to `https://<POLIS_DOMAIN>` so Polis
# emits issuer/callback URLs matching the served host. Leaving POLIS_DOMAIN unset
# keeps the Caddy block inert (unpublished port).
#
# WAL-G backups → object storage and volume snapshots are a follow-on (ADR-035);
# they are NOT implemented here. This file is TLS + reverse proxy + app + an
# optional bundled DB only.
#
# Required env (via .env / env_file): DATABASE_URL, AUTH_SECRET, APP_DOMAIN, and
# — for the bundled-db profile — POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
# (which DATABASE_URL must match, e.g.
#   DATABASE_URL=postgresql://<user>:<pass>@db:5432/<db>).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-app:local}
    restart: unless-stopped
    env_file: .env
    # No published host port: Caddy is the only ingress. The app listens on 3000
    # inside the compose network (see PORT/HOSTNAME in the Dockerfile).
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
        # Optional so the external-db profile (db disabled) does not error.
        required: false

  caddy:
    # Profile-independent: TLS + reverse proxy in every topology.
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  otel-collector:
    # OpenTelemetry Collector — the swappable-backend SEAM (ADR-040). The app
    # exports OTLP here (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318);
    # the Collector fans out to the configured backend (SigNoz by default, see
    # docker/otel-collector-config.yaml). Optional: gated behind the
    # `observability` profile, so the base topology (app + Caddy [+ db]) is
    # unaffected. Bring it up with:
    #   docker compose -f compose.prod.yaml --profile observability up -d
    # Pin to a collector version your tenant has vetted; never `latest`.
    image: otel/opentelemetry-collector-contrib:0.156.0
    profiles:
      - observability
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    expose:
      - "4317" # OTLP gRPC
      - "4318" # OTLP HTTP

  polis:
    # Ory Polis (ex-BoxyHQ SAML Jackson) — SAML→OIDC bridge + SCIM 2.0 directory
    # sync in ONE sidecar (ADR-045, WS-6). OSS core image (Apache-2.0); swap for
    # Ory's enterprise Polis image if you hold that license. Gated behind the `sso`
    # profile so the base topology (app + Caddy [+ db]) is unaffected:
    #   docker compose -f compose.prod.yaml --profile bundled-db --profile sso up -d
    # Then point the app at it (in .env): POLIS_ISSUER=http://polis:5225 (+ the
    # client id/secret from an SSO connection you create in Polis), and configure
    # Polis Directory Sync to POST /api/internal/scim with the SCIM_INTERNAL_SECRET
    # bearer. Pin to a version your tenant has vetted; never `latest`.
    image: boxyhq/jackson:1.52.2
    profiles:
      - sso
    restart: unless-stopped
    environment:
      # Public base URL of Polis. No `:?` required-guard: Compose interpolates every
      # service (even profile-inactive ones) before profile filtering, so a `:?`
      # here would break the base topologies that never start Polis — same pattern
      # as the db block below.
      EXTERNAL_URL: ${POLIS_EXTERNAL_URL:-http://localhost:5225}
      NEXTAUTH_URL: ${POLIS_EXTERNAL_URL:-http://localhost:5225}
      NEXTAUTH_SECRET: ${POLIS_NEXTAUTH_SECRET:-}
      NEXTAUTH_ADMIN_CREDENTIALS: ${POLIS_ADMIN_CREDENTIALS:-}
      # Storage: point DB_URL at the bundled Postgres (or any managed Postgres).
      DB_ENGINE: sql
      DB_TYPE: postgres
      DB_URL: ${POLIS_DB_URL:-}
      # API keys the app/tenant use to manage SSO + dsync connections.
      JACKSON_API_KEYS: ${POLIS_API_KEYS:-}
      SAML_AUDIENCE: ${POLIS_SAML_AUDIENCE:-https://saml.polis}
    expose:
      - "5225"

  db:
    # Bundled Postgres — the default topology. pgvector image (pg18) so the P1
    # vector work has the extension available; NEVER Bitnami (deprecated 2025-08).
    image: pgvector/pgvector:pg18
    profiles:
      - bundled-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      # No `:?` required-guard: Compose interpolates every service (even
      # profile-inactive ones) before profile filtering, so a `:?` here would
      # break the external-db / bare-`up` topologies that never start this db.
      # Left blank by default; the postgres image itself refuses to boot without
      # a password, so requiredness is enforced only when bundled-db is active.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  caddy_data:
  caddy_config:
