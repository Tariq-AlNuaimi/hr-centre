# Staging/Production compose - for Portainer deployment via Git
# Image pulled from GHCR, webhook triggers redeploy on push to main.
#
# IMAGE_TAG: defaults to `latest` for first-deploy convenience. To pin to a specific
# build (rollback or replay-attack-resistant prod), set IMAGE_TAG=sha-<short> in the
# Portainer stack environment variables. The build workflow passes the SHA on the
# webhook query string, so Portainer stack webhooks pick it up automatically.
# See SECURITY.md finding T-04.

services:
  db:
    container_name: next-template-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    container_name: next-template-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    container_name: next-template-minio-init
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set app http://next-template-minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb app/${MINIO_BUCKET:-uploads} --ignore-existing;
        echo 'Bucket ready';
      "
    restart: "no"

  app:
    container_name: next-template-app
    image: ghcr.io/rihal-om/fullstack-next-template:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@next-template-db:5432/${POSTGRES_DB:-app_db}?schema=public"
      MINIO_ENDPOINT: "http://next-template-minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-My App}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      AUDIT_PURGE_TOKEN: ${AUDIT_PURGE_TOKEN}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Sentry observability (ADR-002). DSN values are public-by-design.
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/api/health\", r => process.exit(r.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  backup:
    container_name: next-template-backup
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      POSTGRES_HOST: next-template-db
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
    volumes:
      - ./deploy:/scripts:ro
      - /opt/backup/recipient:/etc/backup/recipient:ro
      - /opt/backup/rclone.conf:/root/.config/rclone/rclone.conf:ro
      - /var/backups:/var/backups
      - miniodata:/var/lib/miniodata:ro
    entrypoint: ["/bin/sh", "/scripts/backup-entrypoint.sh"]

volumes:
  pgdata:
  miniodata:

networks:
  default:
    name: shared-network
