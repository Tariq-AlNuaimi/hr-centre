#cloud-config
# deploy/cloud-init.yml
#
# First-boot configuration injected into every Droplet by scripts/deploy.mjs.
# The script does string substitution for the placeholders below (ssh_pubkey,
# caddy_email, domain, ghcr_auth_b64, backup_age_recipient, rclone_config,
# backup_bucket) before passing the rendered content as user-data.
#
# What this does:
#   1. Creates ops user with sudo + the operator's SSH key
#   2. Installs Docker CE + compose plugin
#   3. Installs Caddy (apt repo) -- reverse proxies :443 -> :3000 with auto LE
#   4. Hardens UFW: allows 22, 80, 443, 9443 only
#   5. Pre-creates /opt/backup/{recipient,rclone.conf} (writes age recipient
#      + rclone config from operator secrets, replacing the prior manual SSH
#      bootstrap step) and runs `rclone mkdir` to create the off-host bucket.

users:
  - name: ops
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - "{{ssh_pubkey}}"

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - jq
  - rclone
  - age

runcmd:
  # Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable" > /etc/apt/sources.list.d/docker.list
  - DEBIAN_FRONTEND=noninteractive apt-get update -y
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ops
  # Caddy. --force-confold tells dpkg to keep the existing /etc/caddy/Caddyfile
  # (the one write_files just wrote with the rendered domain config) instead of
  # prompting interactively about the maintainer's default. Without this the
  # apt-get install fails with "end of file on stdin at conffile prompt".
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
  - DEBIAN_FRONTEND=noninteractive apt-get update -y
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=--force-confold caddy
  - systemctl enable --now caddy
  # UFW
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 9443/tcp
  - ufw --force enable
  # Backup dirs (recipient + rclone.conf land via write_files below).
  - install -d -o ops -g ops -m 0755 /opt/backup
  - install -d -o ops -g ops -m 0700 /opt/backup/keys
  - install -d -o ops -g ops -m 0755 /var/backups
  # Tighten ownership on the secrets written by write_files. cloud-init's
  # `owner:` field in write_files doesn't always survive across distro images
  # (some apply it after the file is written, racing with this runcmd) so we
  # reapply explicitly. The recipient is the age PUBLIC key (0644 OK); the
  # rclone.conf carries DO Spaces secret keys (0600, ops-only).
  - chown ops:ops /opt/backup/recipient /opt/backup/rclone.conf
  - chmod 0644 /opt/backup/recipient
  - chmod 0600 /opt/backup/rclone.conf
  # Pre-create the off-host backup bucket so the first nightly backup has a
  # destination. `rclone mkdir` is idempotent (no-op if the bucket already
  # exists). Failure here is non-fatal: the backup sidecar will retry on its
  # own schedule, and the operator can re-run manually. {{backup_bucket}} is
  # substituted by scripts/deploy.mjs#renderCloudInit (default: <slug>-backups-<env>).
  - sudo -u ops rclone mkdir spaces:{{backup_bucket}} --config /opt/backup/rclone.conf || true
  # Reload Caddy after the Caddyfile has been written via write_files. This
  # replaces the earlier caddy-reload.service indirection: write_files runs
  # before runcmd, so the file is in place by now and a direct reload picks
  # up the rendered domain config. Fall back to restart if reload fails (e.g.
  # Caddy hasn't fully started yet).
  - systemctl reload caddy || systemctl restart caddy

write_files:
  - path: /etc/caddy/Caddyfile
    content: |
      {
        email {{caddy_email}}
      }
      {{domain}} {
        reverse_proxy 127.0.0.1:3000
        encode gzip zstd
        header {
          Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
          X-Content-Type-Options nosniff
          Referrer-Policy strict-origin-when-cross-origin
        }
      }
    permissions: '0644'

  - path: /etc/cron.d/portainer-data-snapshot
    content: |
      # Nightly Portainer data backup -- captures stack defs + admin metadata
      0 3 * * * root tar -czf /var/backups/portainer-$(date +\%Y\%m\%d).tar.gz -C /var/lib/docker/volumes/portainer_data/_data . 2>/dev/null
    permissions: '0644'

  # GHCR pull credentials. Used by Portainer's Docker daemon when the compose
  # stack pulls ghcr.io/<owner>/<repo>:<tag> for the private app image.
  # The `auth` field is base64(github-username:GHCR_PULL_TOKEN). The token is
  # a classic PAT with `read:packages` scope only -- minimum scope so leak
  # blast radius is "pull private images" not full repo admin. Operator
  # creates this once (per-account) and reuses across every project.
  # File permissions 0600 + owned by root: only the Docker daemon (root)
  # reads it.
  - path: /root/.docker/config.json
    content: |
      {
        "auths": {
          "ghcr.io": {
            "auth": "{{ghcr_auth_b64}}"
          }
        }
      }
    permissions: '0600'
    owner: root:root

  # age recipient (public key) -- `deploy/backup.sh` encrypts Postgres dumps
  # + MinIO tarballs to this recipient. The matching private identity is
  # stored ONLY in the BACKUP_AGE_IDENTITY GitHub repo secret, so a host
  # compromise cannot decrypt prior backups.
  # NOTE: no `owner:` set here. Cloud-init's cc_write_files module runs
  # BEFORE cc_users_groups on some Ubuntu builds, so referencing the `ops`
  # user fails with "Unknown user or group". The runcmd chown below
  # corrects ownership to ops once the user exists.
  - path: /opt/backup/recipient
    content: |
      {{backup_age_recipient}}
    permissions: '0644'

  # rclone configuration for the off-host backup target. Contains DO Spaces
  # access key + secret key (Restricted). Mode 0600 + chown to ops in runcmd
  # (see above note on ownership ordering vs cc_users_groups).
  - path: /opt/backup/rclone.conf
    content: |
      {{rclone_config}}
    permissions: '0600'
