#cloud-config
# deploy/cloud-init-base.yml
#
# Cloud-init for building a DigitalOcean snapshot via scripts/build-snapshot.mjs.
# Project-agnostic: installs only the base packages, pre-pulls the Docker base
# images that every fork's docker-compose.prod.yml references, then powers off
# so DO can take a clean snapshot.
#
# The snapshot is referenced later by scripts/deploy.mjs (via the
# DO_BASE_SNAPSHOT_ID_<REGION> repo variable) so subsequent /deploys skip the
# ~4 min apt-install phase and pull the smaller app-layer diff against the
# pre-pulled base.
#
# What this does NOT do (delegated to the per-deploy cloud-init in deploy/cloud-init.yml):
#   - Write the per-project Caddyfile (domain varies per fork)
#   - Write GHCR auth (project-specific token)
#   - Write backup recipient + rclone.conf (project-specific secrets)
#   - Open firewall for HTTP/S (done per-deploy so destroy is clean)
#
# Sized to keep the snapshot small: clears apt cache, machine-id, cloud-init
# instance data before powering off.

# Skip OS upgrade -- we want a deterministic snapshot. Operator re-runs
# /build-snapshot periodically for security updates.
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - jq
  - rclone
  - age

runcmd:
  # Docker (the slow one: ~60s of apt install + ~150MB)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable" > /etc/apt/sources.list.d/docker.list
  - DEBIAN_FRONTEND=noninteractive apt-get update -y
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # Caddy (small ~20MB but still ~20s of install)
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
  - DEBIAN_FRONTEND=noninteractive apt-get update -y
  - DEBIAN_FRONTEND=noninteractive apt-get install -y caddy

  # Pre-pull the Docker base images that every fork's docker-compose.prod.yml
  # depends on. Tags match docker-compose.prod.yml exactly so the per-deploy
  # `docker compose pull` only fetches the app-layer diff (50-100MB vs 250MB
  # cold). When these tags drift, re-run /build-snapshot.
  - docker pull postgres:17-alpine
  - docker pull minio/minio:RELEASE.2025-04-22T22-12-26Z
  - docker pull minio/mc:latest
  - docker pull alpine:3.20
  - docker pull node:24-alpine

  # Shrink the snapshot before powering off
  - apt-get clean
  - rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
  # Reset cloud-init so the snapshot-derived droplet runs cloud-init again
  # with its own (project-specific) user-data. Without this, /deploy's
  # cloud-init runcmd would not re-execute on snapshot boot.
  - cloud-init clean --logs --machine-id || true
  - truncate -s 0 /etc/machine-id || true
  - rm -rf /var/lib/cloud/* || true
  # Clear shell history (paranoia; the snapshot is private to the operator's
  # DO account but a future GHCR_PULL_TOKEN issue could expose it).
  - history -c 2>/dev/null || true
  - rm -f /root/.bash_history /home/*/.bash_history 2>/dev/null || true

  # Power off -- DO snapshot quality is best from a powered-off droplet.
  # `shutdown -P now` triggers the graceful poweroff; scripts/build-snapshot.mjs
  # polls the droplet's status until it reports 'off' before calling the
  # snapshot action.
  - shutdown -P now
